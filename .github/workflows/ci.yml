name: CI

# SPEC section 9: GitHub Actions: lint, typecheck, test, build image.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types, tests (PostgreSQL and SQLite), end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stocksafe
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: stocksafe
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U stocksafe -d stocksafe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://stocksafe:change-me@localhost:5434/stocksafe
      TEST_DATABASE_URL: postgresql://stocksafe:change-me@localhost:5434/stocksafe_test
      E2E_DATABASE_URL: postgresql://stocksafe:change-me@localhost:5434/stocksafe_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests (including the 2,000-row messy import and the Hindi message checks)
        run: npm test
      - name: Integration tests on PostgreSQL (ledger, FEFO, concurrency, workflows, reports)
        run: npm run test:integration
      - name: The same suites on SQLite (single-PC mode)
        run: npm run test:sqlite
      - name: Restore the PostgreSQL client after the SQLite run
        run: npx prisma generate
      - name: Build
        run: npm run build
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (GRN, indent, issue, dispense, expiry alert, write-off, ledger)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    name: Build the Docker image and check a clean install
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: The three-command install, on a clean machine
        run: |
          cp .env.example .env
          docker compose up -d --build
          code=000
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3002/api/health || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          [ "$code" = "200" ] || { docker compose logs; exit 1; }
          docker compose exec -T -e SEED_DEMO=0 app npx prisma db seed
      - name: The app answers
        run: |
          curl -fsS http://localhost:3002/ | grep -q "Stop throwing away expired medicines"
          curl -fsS http://localhost:3002/login | grep -q "StockSafe"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3002/api/items)" = "401"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
