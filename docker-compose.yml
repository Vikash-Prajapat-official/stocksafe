services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stocksafe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: stocksafe
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432" # local dev tools only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksafe -d stocksafe"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: stocksafe:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://stocksafe:${POSTGRES_PASSWORD:-change-me}@db:5432/stocksafe
      AUTH_SECRET: ${AUTH_SECRET:-} # blank: the app makes one on first start and keeps it in the appdata volume
      AUTH_TRUST_HOST: "true"
      PORT: "3002" # the port inside the container; PORT in .env only chooses the port on the PC
    ports:
      - "${PORT:-3002}:3002"
    volumes:
      - backups:/backups:ro # so the System page can show the latest backup
      - appdata:/app/data # the generated session secret
    depends_on:
      db:
        condition: service_healthy
    # Apply migrations, then start the server.
    command: sh -c "npx prisma migrate deploy && npm run start"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  worker:
    image: stocksafe:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://stocksafe:${POSTGRES_PASSWORD:-change-me}@db:5432/stocksafe
    depends_on:
      app:
        condition: service_healthy
    command: ["npm", "run", "worker"]

  backup:
    build: ./backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: stocksafe
      PGDATABASE: stocksafe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # healthy once a backup newer than 26 hours exists
      test: ["CMD-SHELL", "find /backups -name 'stocksafe-*.sql.gz.enc' -mmin -1560 | grep -q ."]
      interval: 5m
      timeout: 10s
      start_period: 3m
      retries: 2

  # Optional HTTPS (camera barcode scanning on phones, installable app). Start with: docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  appdata:
  caddy_data:
  pgdata:
  backups:
